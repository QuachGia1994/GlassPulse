name: GlassPulse
options:
  bundleIdPrefix: com.quachgia
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  GlassPulse:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared/Activity
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Glass Pulse
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quachgia.glasspulse
        PRODUCT_NAME: GlassPulse
        PRODUCT_MODULE_NAME: GlassPulse
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: GlassPulseWidgetExtension
        embed: true
  GlassPulseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Shared/Activity
      - WidgetExtension
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Glass Pulse Live
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quachgia.glasspulse.widgets
        PRODUCT_NAME: GlassPulseWidgetExtension
        PRODUCT_MODULE_NAME: GlassPulseWidgetExtension
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
  GlassPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: GlassPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quachgia.glasspulse.tests
        GENERATE_INFOPLIST_FILE: YES
  GlassPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: GlassPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quachgia.glasspulse.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GlassPulse:
    build:
      targets:
        GlassPulse: all
        GlassPulseTests: [test]
        GlassPulseUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Resources/StoreKit.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GlassPulseTests
        - GlassPulseUITests
