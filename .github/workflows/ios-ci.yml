name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glass-pulse-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Xcode 27 build and test
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Require Swift 6.4 toolchain
        run: |
          xcode_version="$(xcodebuild -version | head -1)"
          swift_version="$(swift --version | head -1)"
          echo "$xcode_version"
          echo "$swift_version"
          [[ "$xcode_version" == Xcode\ 27* ]] || { echo "Expected Xcode 27."; exit 1; }
          [[ "$swift_version" == *"Swift version 6.4"* ]] || { echo "Expected Swift 6.4."; exit 1; }

      - name: Generate Xcode project
        run: |
          xcodegen generate
          xcodebuild -list -project GlassPulse.xcodeproj

      - name: Select available iPhone simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          devices = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )["devices"]

          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device["name"].startswith("iPhone"):
                      with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                          env_file.write(f"SIMULATOR_ID={device['udid']}\n")
                      print(f"Using {device['name']} ({device['udid']})")
                      raise SystemExit(0)

          raise SystemExit("No available iPhone simulator found")
          PY

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassPulse.xcodeproj \
            -scheme GlassPulse \
            -configuration Debug \
            -derivedDataPath .build \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild \
            -project GlassPulse.xcodeproj \
            -scheme GlassPulse \
            -configuration Debug \
            -derivedDataPath .build \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GlassPulse-iOS-Simulator-Xcode27
          path: .build/Build/Products/Debug-iphonesimulator/GlassPulse.app
          if-no-files-found: error

  unsigned-ipa:
    name: Build unsigned IPA
    needs: build-test
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project GlassPulse.xcodeproj \
            -scheme GlassPulse \
            -configuration Release \
            -archivePath .build/GlassPulse.xcarchive \
            -destination 'generic/platform=iOS' \
            -showBuildTimingSummary \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) GLASS_PULSE_BETA' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify archived resources and App Icon
        run: |
          set -euo pipefail
          app_path=".build/GlassPulse.xcarchive/Products/Applications/GlassPulse.app"
          info_path="$app_path/Info.plist"
          assets_path="$app_path/Assets.car"

          test -f "$assets_path" || { echo "Assets.car is missing from the archive."; exit 1; }
          test -d "$app_path/PlugIns/GlassPulseWidgetExtension.appex" || { echo "Live Activity extension is missing from the archive."; exit 1; }
          plutil -p "$info_path" | tee .build/archive-info.txt
          grep -q 'CFBundleIcons' .build/archive-info.txt || { echo "CFBundleIcons is missing."; exit 1; }
          grep -q 'AppIcon' .build/archive-info.txt || { echo "AppIcon is missing from Info.plist icon metadata."; exit 1; }
          xcrun assetutil --info "$assets_path" | tee .build/archive-assets.json
          grep -q 'AppIcon' .build/archive-assets.json || { echo "AppIcon is missing from compiled Assets.car."; exit 1; }

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path=".build/GlassPulse.xcarchive/Products/Applications/GlassPulse.app"
          package_root=".build/unsigned-ipa"

          if [[ ! -d "$app_path" ]]; then
            echo "Archived app not found at $app_path"
            exit 1
          fi

          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/GlassPulse.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry ../GlassPulse.ipa Payload
          )
          test -s .build/GlassPulse.ipa
          shasum -a 256 .build/GlassPulse.ipa

      - name: Enforce IPA and installed-size budgets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          budget = 25 * 1024 * 1024
          ipa = Path('.build/GlassPulse.ipa')
          app = Path('.build/GlassPulse.xcarchive/Products/Applications/GlassPulse.app')

          def tree_size(path: Path) -> int:
              return sum(item.stat().st_size for item in path.rglob('*') if item.is_file())

          measurements = [('compressed IPA', ipa.stat().st_size), ('GlassPulse.app', tree_size(app))]
          measurements.extend(
              (appex.name, tree_size(appex))
              for appex in sorted((app / 'PlugIns').glob('*.appex'))
          )

          failed = False
          for label, size in measurements:
              print(f'{label}: {size} bytes ({size / 1024 / 1024:.2f} MiB)')
              if size >= budget:
                  print(f'ERROR: {label} must remain below 25 MiB.')
                  failed = True

          if failed:
              raise SystemExit(1)
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GlassPulse-unsigned-IPA-Xcode27
          path: .build/GlassPulse.ipa
          if-no-files-found: error
