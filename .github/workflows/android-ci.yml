name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: glass-pulse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and unit tests
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            lintProductionDebug \
            testProductionDebugUnitTest \
            testBetaDebugUnitTest \
            assembleBetaDebugAndroidTest

      - name: Verify music provenance and icon resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          provenance = json.loads((root / 'Media/Music/PROVENANCE.json').read_text(encoding='utf-8'))
          track = provenance['track']

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          master = root / track['master']['path']
          assert master.exists(), 'music master is missing'
          assert sha256(master) == track['master']['sha256'], 'master checksum mismatch'

          encodes = {entry['platform']: entry for entry in track['encodes']}
          assert set(encodes) == {'android', 'ios'}, 'both platform encodes must be recorded'
          for platform, entry in encodes.items():
              encode_path = root / entry['path']
              assert encode_path.exists(), f'{platform} encode is missing'
              assert sha256(encode_path) == entry['sha256'], f'{platform} encode checksum mismatch'
              assert encode_path.stat().st_size < 1.5 * 1024 * 1024, f'{platform} encode exceeds 1.5 MiB'

          android_encode = root / encodes['android']['path']
          assert android_encode == root / 'android/app/src/main/res/raw/bgm.ogg', 'android encode path moved'

          for icon in [
              'android/app/src/main/res/mipmap-anydpi/ic_launcher.xml',
              'android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml',
              'android/app/src/main/res/drawable/ic_glass_pulse_foreground.xml',
              'android/app/src/main/res/drawable/ic_glass_pulse_monochrome.xml',
          ]:
              assert (root / icon).exists(), f'icon resource missing: {icon}'

          for icon_xml in [
              root / 'android/app/src/main/res/mipmap-anydpi/ic_launcher.xml',
              root / 'android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml',
          ]:
              content = icon_xml.read_text(encoding='utf-8')
              assert 'adaptive-icon' in content, f'{icon_xml} is not an adaptive icon'
              assert 'monochrome' in content, f'{icon_xml} lacks a monochrome layer'

          print('Music provenance and icon resource assertions passed.')
          PY

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GlassPulse-android-lint-reports
          path: android/app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package beta APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble beta debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleBetaDebug

      - name: Verify signed APK and size
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/beta/debug/app-beta-debug.apk"
          output="android/app/build/outputs/apk/beta/debug/GlassPulse-beta-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          size="$(stat -c%s "$apk")"
          echo "APK size: $size bytes"
          if (( size >= 25 * 1024 * 1024 )); then
            echo "ERROR: APK must remain below 25 MiB."
            exit 1
          fi
          sha256sum "$apk"
          cp "$apk" "$output"
          sha256sum "$output"

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassPulse-android-beta-apk
          path: android/app/build/outputs/apk/beta/debug/GlassPulse-beta-debug.apk
          if-no-files-found: error
